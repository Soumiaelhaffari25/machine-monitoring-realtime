name: CI

# Quand declencher : a chaque push et pull request sur main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint et tests
    runs-on: ubuntu-latest

    steps:
      # 1. Recuperer le code du depot
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Installer Python 3.11
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Installer les outils de test et de lint
      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      # 4. Verifier la qualite du code (linting)
      - name: Lint avec flake8
        run: |
          flake8 spark_job/rules_logic.py tests/ --max-line-length=120 --count --statistics

      # 5. Lancer les tests
      - name: Tests avec pytest
        run: pytest tests/ -v

  build-images:
    name: Build des images Docker
    runs-on: ubuntu-latest
    needs: test    # ne s'execute que si les tests passent

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # Construire l'image du producteur (verifie que le Dockerfile est valide)
      - name: Build image producteur
        run: docker build -t machine-monitoring/producer:ci -f producer/Dockerfile .